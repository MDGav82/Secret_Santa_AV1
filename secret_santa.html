    <script>
        function getRandomNullId() {
            fetch('bddconnec.php')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('result').innerText = data.error;
                    } else {
                        document.getElementById('result').innerText = `Random ID: ${data.id}`;
                    }
                })
                .catch(error => {
                    document.getElementById('result').innerText = 'Error fetching data: ' + error;
                });
        }
        document.getElementById('randomizeButton').addEventListener('click', getRandomNullId);
