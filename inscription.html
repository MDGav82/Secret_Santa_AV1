<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Secret Santa - Connexion / Inscription</title>    
</head>
<center>
<body>
    Bienvenue sur la page d'inscription
<br><br>
<form>
    <label for="nom">Nom:</label>
    <input type="text" id="nom" name="nom"><br><br>
</form><br>
<button onclick="testJS()">S'inscrire</button>
<script>
    function testJS() {
    var b = document.getElementById('nom').value,
        url = 'secret_santa.html?name=' + encodeURIComponent(b);
    
    document.location.href = url;
    }
</script>
</center>
</body></html>
