<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa - Application</title>
    <style>
        html {
            background-color: #149d32;
            color: darkred;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        
    </style>
</head>
<center>
<body>

<h1>Secret Santa</h1>

<table id="santaTable">
    <thead>
        <tr>
            <th>Nom</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<input type="text" id="nameInput" placeholder="JOHN SANTA">
<button onclick="addRow()">Ajouter un nom</button>

<br><br>

<button onclick="assignSecretSanta()">Assigner les Secret Santas</button>

<p id="result"></p>

<script>
    function addRow() {
        const nameInput = document.getElementById('nameInput');
        const name = nameInput.value.trim();
        if (name === "") {
            alert("Ajoutez des noms SVP.");
            return;
        }
        const table = document.getElementById('santaTable').getElementsByTagName('tbody')[0];
        const newRow = table.insertRow();
        const newCell = newRow.insertCell(0);
        newCell.textContent = name;
        newCell.classList.add('name-cell');
        newCell.classList.add('hidden');
        nameInput.value = '';
    }

    function assignSecretSanta() {
        const table = document.getElementById('santaTable').getElementsByTagName('tbody')[0];
        const rows = table.getElementsByTagName('tr');
        const names = [];
        for (let i = 0; i < rows.length; i++) {
            names.push(rows[i].cells[0].textContent);
        }
        if (names.length < 2) {
            alert("Vos avez besoins de au moins 2 noms pour pouvoir affecter les Secret Santas!");
            return;
        }
        const shuffledNames = shuffleArray(names.slice());
        const result = [];
        for (let i = 0; i < names.length; i++) {
            const giver = names[i];
            const receiver = shuffledNames[i === names.length - 1 ? 0 : i + 1];
            result.push({giver, receiver});
        }
        document.getElementById('result').innerHTML = "<strong>Clickez sur un des noms pour réveler à qui ils doivent offrir leurs cadeau(x)!!</strong>";
        const cells = table.getElementsByTagName('td');
        for (let i = 0; i < cells.length; i++) {
            cells[i].onclick = function() {
                const clickedName = cells[i].textContent;
                const pair = result.find(p => p.giver === clickedName);
                alert(`${pair.giver} doit offrir un/des cadeau(x) à : ${pair.receiver}`);
                cells[i].classList.remove('hidden');
            };
        }
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
</script>

</body>
</center>
</html>
